<!DOCTYPE html>

    <title>Central Head - Productos</title>
    <style>
        /* Estilos generales */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('fornite.webp') no-repeat center center;
            background-size: cover;
            filter: blur(8px); /* Ajusta el valor para más o menos desenfoque */
            opacity: 0.5; /* Ajusta la opacidad según prefieras */
            z-index: -1;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a; /* Fondo oscuro */
            color: #fff; /* Texto blanco */
        }
        /* Barra de notificación */
        .barra-notificacion {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #FFA500; /* Naranja */
            color: #fff;
            padding: 10px 0;
            text-align: center;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            box-sizing: border-box;
            z-index: 1000; /* Asegura que la barra esté por encima de otros elementos */
        }

        .barra-notificacion p {
            display: inline-block;
            animation: desplazamiento 10s linear infinite;
            margin: 0;
        }

        @keyframes desplazamiento {
            0% {
                transform: translateX(100%);
            }
            100% {
                transform: translateX(-100%);
            }
        }
        /* Barra de navegación principal */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            padding: 10px 20px;
            position: fixed;
            top: 40px; /* Debajo de la barra de notificación */
            left: 0;
            width: 100%;
            z-index: 999; /* Asegura que la barra esté por encima de otros elementos */
        }

        .navbar-brand {
            font-size: 24px;
            color: #1e90ff; /* Azul brillante */
            text-decoration: none;
        }

        .navbar ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }

        .navbar li {
            margin-left: 20px;
        }

        .navbar a {
            text-decoration: none;
            color: #fff;
            font-size: 16px;
        }

        /* Barra de navegación secundaria */
        .navbar-secundaria {
            background-color: #444;
            padding: 5px 20px;
            margin-top: 80px; /* Espacio para las barras fijas */
        }

        .navbar-secundaria ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }

        .navbar-secundaria li {
            margin-left: 20px;
        }

        .navbar-secundaria a {
            text-decoration: none;
            color: #fff;
            font-size: 14px;
        }

        /* Contenedor de productos */
        main {
            padding: 20px;
            margin-top: 120px; /* Espacio para las barras fijas */
        }

        h2 {
            text-align: center;
            color: #1e90ff; /* Azul brillante */
        }

        /* Estilos de la cuadrícula de productos */
        .productos-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .producto {
            background-color: #333;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .producto:hover {
            transform: scale(1.1);
        }

        .producto img {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }

        .producto h3 {
            color: #1e90ff; /* Azul brillante */
            font-size: 18px;
            margin: 10px 0;
        }

        .producto p {
            font-size: 14px;
            margin: 5px 0;
        }

        .precio {
            font-size: 16px;
            font-weight: bold;
            color: #1e90ff; /* Azul brillante */
        }

        /* Estilos del botón "Comprar" */
        .btn-comprar {
            background-color: #ff0000; /* Rojo */
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .btn-comprar:hover {
            background-color: #cc0000; /* Rojo oscuro */
        }

        
        
        
        
    </style>
