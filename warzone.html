    <style>
        /* Estilos generales */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #fff;
        }

        .productos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .producto {
            background: #333;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .producto img {
            width: 100%;
            border-radius: 8px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
        }

        .modal-content {
            background-color: #333;
            padding: 20px;
            margin: 10% auto;
            width: 80%;
            max-width: 400px;
            border-radius: 8px;
            text-align: center;
        }

        .close {
            color: #fff;
            float: right;
            font-size: 24px;
            cursor: pointer;
        }

        .btn-comprar {
            background-color: #ff0000;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease;
            display: inline-block;
            margin-top: 10px;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('warzonefondo.png') no-repeat center center;
            background-size: cover;
            filter: blur(8px);
            opacity: 0.5;
            z-index: -1;
        }

        /* Barra de notificación */
        .barra-notificacion {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #FFA500;
            color: #fff;
            padding: 10px 0;
            text-align: center;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            box-sizing: border-box;
            z-index: 1000;
        }

        .barra-notificacion p {
            display: inline-block;
            animation: desplazamiento 10s linear infinite;
            margin: 0;
        }

        @keyframes desplazamiento {
            0% {
                transform: translateX(100%);
            }
            100% {
                transform: translateX(-100%);
            }
        }

        /* Barra de navegación principal */
        .navbar {
            display: flex;
            justify-content: flex-start; /* Alinea a la izquierda */
            align-items: center;
            background-color: #333;
            padding: 10px 20px;
            position: fixed;
            top: 40px;
            left: 0;
            width: 100%;
            z-index: 999;
        }

        .navbar-brand {
            font-size: 24px;
            color: #1e90ff;
            text-decoration: none;
        }

        .navbar ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }

        .navbar li {
            margin-left: 20px;
        }

        .navbar a {
            text-decoration: none;
            color: #fff;
            font-size: 16px;
        }

        /* Contenedor de productos */
        main {
            padding: 20px;
            margin-top: 120px;
        }

        h2 {
            text-align: center;
            color: #1e90ff;
        }

        /* Estilos de la cuadrícula de productos */
        .productos-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .producto {
            background-color: #333;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .producto:hover {
            transform: scale(1.1);
        }

        .producto img {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }

        .producto h3 {
            color: #1e90ff;
            font-size: 18px;
            margin: 10px 0;
        }

        .producto p {
            font-size: 14px;
            margin: 5px 0;
        }

        .precio {
            font-size: 16px;
            font-weight: bold;
            color: #1e90ff;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
        }

        .modal-content {
            background-color: #333;
            padding: 20px;
            margin: 15% auto;
            width: 80%;
            max-width: 400px;
            border-radius: 8px;
            text-align: center;
        }

        .close {
            color: #fff;

            font-size: 24px;
            cursor: pointer;
        }

        .btn-comprar {
            background-color: #ff0000;

            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease;
            display: inline-block;
            margin-top: 10px;
        }

    </style>
</head>

    <!-- Código JavaScript -->
    <script>
        // Función para mostrar el modal con la información
        function mostrarInformacion(texto) {
            document.getElementById('informacion-texto').innerText = texto;
            document.getElementById('modal').style.display = 'block';
        }

        // Función para cerrar el modal
        function cerrarModal() {
            document.getElementById('modal').style.display = 'none';
        }

        // Cerrar el modal cuando se haga clic fuera de él
        window.onclick = function(event) {
            if (event.target == document.getElementById('modal')) {
                cerrarModal();
            }
        }
        
    </script>
